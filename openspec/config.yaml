schema: spec-driven

# Project context — 生成规格工件时自动注入给 AI 的项目背景
context: |
  产品：rag-kb，toB 企业级文档知识库（RAG），面向团队，目标支持百人级协作。
  成员上传各类文档（Markdown/代码/JSON-YAML-XML/DOCX/PPTX/文本或扫描 PDF/图片/字幕/音视频）
  → 解析 → 结构感知切块（V3）→ 向量化 → 混合检索问答。

  技术选型（2026-07-21 更新：Java→Python 迁移完成，Spring Boot 版 `backend/` 已退役删除，
  `backend-py/` 是唯一后端，此前版本的 Spring Boot/Hibernate 描述已过时）：
  - 后端：FastAPI（认证/RBAC/多租户/审计/调用编排），统一响应格式与 RESTful 风格
  - RAG Core：**自研**（`backend-py/app/ragcore`），不依赖 RAGFlow/LangChain/LlamaIndex/Dify 等高层编排框架
    - 解析：自研 Parser（Markdown/DOCX/PPTX/PDF/代码/结构化数据等）+ 进程内本地多模态解析
      `LocalMultimodalDocumentParser`（deepdoc OCR + faster-whisper ASR；原独立
      `parser-gateway` 微服务已合并进程内并删除，不再是独立部署单元）
    - 切块：自研 TechnicalChunker V3（结构感知五招式）
    - 检索：Elasticsearch 原生 BM25 + kNN 双路召回 + RRF 融合，可选 Rerank，低置信度拒答
  - 模型服务：OpenAI 兼容 HTTP 客户端对接云端 API——Embedding/Rerank 用硅基流动（`BAAI/bge-m3`/`BAAI/bge-reranker-v2-m3`），生成用 DeepSeek（`deepseek-chat`）
  - 业务存储：PostgreSQL（Alembic 无迁移框架/Flyway 历史迁移沿用，SQLAlchemy + `contextvars.ContextVar`
    租户上下文按 org_id 强制过滤，语义对应原 Hibernate `tenantFilter`）；对象存储走
    `ObjectStorage` 抽象，本地开发用文件系统，生产同构环境用 MinIO/S3
  - 摄取流水线：PostgreSQL `ingestion_job` 表 + Worker 轮询式异步摄取、租约心跳、失败重试——**不是**消息队列（无 Kafka/RabbitMQ/Redis Stream 依赖）

  企业级硬约束（toB 必备）：
  - 多租户：组织 → 团队/成员，知识库级权限（RBAC：OWNER/ADMIN/MEMBER），租户间数据绝不串（最高优先级红线，`contextvars.ContextVar` 租户上下文 + 每查询路径强制 org_id 过滤）
  - 认证：本地邮箱+密码 + JWT（**非** SSO/OIDC，当前未接入外部身份提供商）
  - 异步摄取：Worker 轮询削峰 + 处理进度可见
  - 可观测：查询审计（`rag_query_audit` 表）、检索/生成延迟记录
  - 配额限流：**尚未实现**（Redis 目前唯一用途是 JWT 黑名单，无限流/缓存能力，规划中不代表已落地）
  - 审计：操作可追溯

  编码约定：
  - 所有注释/文档/commit message 用中文，代码标识符用英文
  - 密钥放 .env / application-secret，禁止硬编码与提交
  - 多租户隔离必须在每个查询路径强制校验，安全测试覆盖跨租户访问
  - RAG Core 必须自研并保持模块化；不得重新引入 RAGFlow、LangChain、LlamaIndex、Dify 等高层 RAG 编排框架

# Per-artifact rules — 各工件的额外约束
rules:
  proposal:
    - 必须包含 "Non-goals（非目标）" 一节，明确这次不做什么
    - 控制在 500 字以内，聚焦"为什么做"和"边界"
  specs:
    - 每个场景用 WHEN/THEN 形式写清楚，覆盖正常路径 + 关键失败/边界场景
    - toB 功能必须包含"跨租户隔离/越权访问被拒"的安全场景
  tasks:
    - 拆成可执行小任务，每个任务粒度不超过 2 小时
    - 涉及多租户/权限的任务必须配套安全测试
