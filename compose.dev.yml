name: rag-kb

# rag-kb 项目专属本地开发依赖,不与其他项目(thxpace 等)共用任何组件,包括 Postgres——
# 之前 Postgres 一直借用本机原生共享实例(和其他十几个项目的库挤在一起),现在改成
# 独立容器,数据从原生库迁移过来(见迁移记录)。Java 后端(backend/)已退役删除,
# backend-py/ 是唯一后端。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragkb
      POSTGRES_USER: ragkb
      POSTGRES_PASSWORD: ragkb-local-dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragkb -d ragkb"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ragkb
      MONGO_INITDB_ROOT_PASSWORD: ragkbmongo2026
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9011"]
    environment:
      MINIO_ROOT_USER: ragkb
      MINIO_ROOT_PASSWORD: bddc393e186ef5e0944b497a53b62ee7c91919a0
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9011"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 ragkb bddc393e186ef5e0944b497a53b62ee7c91919a0
        && mc mb --ignore-existing local/rag-kb

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5602:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  minio_data:
  es_data:
