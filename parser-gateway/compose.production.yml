services:
  parser-gateway:
    build:
      context: .
    image: ${PARSER_IMAGE:-rag-parser-gateway:1.0.0}
    restart: unless-stopped
    init: true
    ports:
      - "${PARSER_BIND_ADDRESS:-127.0.0.1}:${PARSER_PORT:-8081}:8081"
    environment:
      PARSER_API_KEY: ${PARSER_API_KEY:?PARSER_API_KEY is required}
      PARSER_METRICS_KEY: ${PARSER_METRICS_KEY:?PARSER_METRICS_KEY is required}
      PARSER_MAX_FILE_BYTES: ${PARSER_MAX_FILE_BYTES:-2147483648}
      PARSER_MAX_CONCURRENCY: ${PARSER_MAX_CONCURRENCY:-2}
      PARSER_WHISPER_MODEL: ${PARSER_WHISPER_MODEL:-small}
      PARSER_WHISPER_DEVICE: ${PARSER_WHISPER_DEVICE:-cpu}
      PARSER_WHISPER_COMPUTE_TYPE: ${PARSER_WHISPER_COMPUTE_TYPE:-int8}
      PARSER_PRELOAD_WHISPER: ${PARSER_PRELOAD_WHISPER:-true}
      PARSER_REQUIRE_ASR_READY: ${PARSER_REQUIRE_ASR_READY:-true}
      PARSER_PRELOAD_OCR: ${PARSER_PRELOAD_OCR:-true}
      PARSER_REQUIRE_OCR_READY: ${PARSER_REQUIRE_OCR_READY:-true}
    volumes:
      - parser_models:/models
    tmpfs:
      - /tmp:size=${PARSER_TMPFS_SIZE:-4g},mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    cpus: ${PARSER_CPU_LIMIT:-4.0}
    mem_limit: ${PARSER_MEMORY_LIMIT:-8g}
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m

volumes:
  parser_models:
