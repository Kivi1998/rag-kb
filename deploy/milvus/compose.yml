name: rag-kb-milvus-dev

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  object-storage:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RAG_MILVUS_MINIO_ACCESS_KEY:?请在本机环境配置 RAG_MILVUS_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${RAG_MILVUS_MINIO_SECRET_KEY:?请在本机环境配置 RAG_MILVUS_MINIO_SECRET_KEY}
    volumes:
      - milvus_object_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  standalone:
    image: milvusdb/milvus:v2.6.19
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: object-storage:9000
      MINIO_ACCESS_KEY_ID: ${RAG_MILVUS_MINIO_ACCESS_KEY:?请在本机环境配置 RAG_MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${RAG_MILVUS_MINIO_SECRET_KEY:?请在本机环境配置 RAG_MILVUS_MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${RAG_MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${RAG_MILVUS_HEALTH_PORT:-19091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    mem_limit: 4g

volumes:
  milvus_etcd_data:
  milvus_object_data:
  milvus_data:
