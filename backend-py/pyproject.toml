[project]
name = "rag-kb-backend"
version = "0.1.0"
description = "toB 企业级文档知识库 — 编排后端(Python/FastAPI 重写,替代 backend/ Java 版)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # passlib 1.7.4 的 bcrypt 后端探测代码读取 `bcrypt.__about__.__version__`；
    # bcrypt>=4.1 移除了这个属性，会导致 passlib 在首次 hash/verify 时抛出
    # AttributeError/ValueError（详见 pyup.io/passlib#171 系列已知问题）。锁定
    # 兼容区间，不是引入新依赖，只是约束 passlib[bcrypt]] extra 实际解析到的版本。
    "bcrypt>=4.0,<4.1",
    "redis==5.2.0",
    "motor==3.6.0",
    "minio==7.2.12",
    "elasticsearch==8.17.0",
    # elasticsearch 的 AsyncElasticsearch 传输层需要 aiohttp 作为 HTTP 节点实现;
    # 之前没人真实实例化过这个客户端(全是 mock 测试),整合联调时才发现缺失。
    "aiohttp==3.11.11",
    "pymilvus==2.6.2",
    # httpx.AsyncClient() 默认信任系统代理环境变量;本机(以及不少企业网络环境)配了
    # SOCKS 代理(all_proxy=socks5://...),没有 socksio 会在构造客户端时直接 ImportError。
    # 补齐依赖比强制 trust_env=False 更稳妥——后者会让"部署环境本来就需要代理才能出网"
    # 的场景反而连不上真实模型 API。
    "httpx[socks]==0.28.1",
    "python-multipart==0.0.20",
    "prometheus-client==0.21.1",
    "pymupdf==1.26.3",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    # 以下为 deepdoc OCR/版面识别/表格结构识别 + NLP 分词器模块的依赖,移植自
    # parser-gateway/requirements.txt(版本号照抄,勿自行升级)。
    "onnxruntime==1.27.0",
    "huggingface_hub==1.23.0",
    "opencv-python-headless==5.0.0.93",
    "shapely==2.1.2",
    "pyclipper==1.4.0",
    "six==1.17.0",
    "datrie==0.8.3",
    "hanziconv==0.3.2",
    "nltk==3.10.0",
    # 从 parser-gateway/requirements.txt 移植的 ASR(faster-whisper)能力依赖，
    # 用于 app.ragcore.parser.asr 内置模块，替代原先跨进程 HTTP 调用 parser-gateway。
    "faster-whisper==1.2.0",
    # faster-whisper 1.2.0 的 faster_whisper/utils.py 直接 `import requests`，但这个依赖
    # 没有被它自己的包元数据(Requires-Dist)声明——纯装 faster-whisper 会在 import 阶段
    # 直接 ModuleNotFoundError。parser-gateway/requirements.txt 里单独列了同一版本号，
    # 说明这是已知的必要传递依赖，这里照抄版本号一并声明，而不是隐式依赖它凑巧被别的包带进来。
    "requests==2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "mypy==1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
