name: rag-kb-acceptance

x-backend-common: &backend-common
  build:
    context: ../backend-py
    dockerfile: Dockerfile
  image: rag-kb-backend:acceptance
  restart: unless-stopped
  init: true
  environment: &backend-environment
    # Java 版是 JDBC URL(不含密码,密码走独立的 DB_USERNAME/DB_PASSWORD);Python 版
    # `app/core/db.py` 把 db_url 整串直接传给 SQLAlchemy create_async_engine(),
    # DB_USERNAME/DB_PASSWORD 这两个 Settings 字段从未被用来连接——asyncpg 方言 +
    # 用户名密码内嵌在 URL 里才是 Python 侧唯一生效的连接方式。
    DB_URL: postgresql+asyncpg://ragkb:ragkb-acceptance@postgres:5432/ragkb
    REDIS_HOST: redis
    REDIS_PORT: 6379
    JWT_SECRET: acceptance-only-jwt-secret-at-least-32-bytes-2026
    # Python 侧尚未实现 Prometheus /metrics 端点(见 TODOS.md 已知缺口),这个变量在
    # Python 侧是完全无效的死配置,留着不报错(pydantic-settings extra="ignore"),
    # 不删是为了未来实现 metrics 端点时环境变量名已经就位。
    RAG_METRICS_TOKEN: backend-acceptance-metrics-key
    RAG_STORAGE_TYPE: minio
    MINIO_ENDPOINT: http://minio:9000
    MINIO_BUCKET: rag-kb
    MINIO_ACCESS_KEY: ragacceptance
    MINIO_SECRET_KEY: ragacceptance-secret
    # 本地 deepdoc OCR(app.ragcore.parser.local_multimodal_parser),已验证真实
    # 可用,打开后验收覆盖扫描 PDF/图片/内嵌图片 DOCX·PPTX 这几类必须走多模态
    # 兜底的格式,不再像早期(parser-gateway 刚下线时)保守关闭。音视频(ASR)
    # 支持已于 2026-09 移除。
    RAG_MULTIMODAL_PARSER_ENABLED: "true"
    RAG_UPLOAD_MAX_SIZE_BYTES: 2147483648
    RAG_ES_HEALTH_ENABLED: "false"
  read_only: true
  tmpfs:
    - /tmp:size=2g,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  cpus: 2.0
  mem_limit: 1536m
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully

x-worker-environment: &worker-environment
  <<: *backend-environment
  RAG_INGESTION_WORKER_ENABLED: "true"
  RAG_INGESTION_WORKER_CONCURRENCY: 2
  RAG_INGESTION_WORKER_BATCH_SIZE: 8
  RAG_INGESTION_POLL_INTERVAL_MS: 250
  RAG_INGESTION_WORKER_LEASE_DURATION_MS: 120000
  RAG_EMBEDDING_ENABLED: "true"
  RAG_EMBEDDING_ENDPOINT: http://model-stub:8082/v1/embeddings
  RAG_EMBEDDING_MODEL: acceptance-embedding-v1
  RAG_EMBEDDING_BATCH_SIZE: 32
  RAG_EMBEDDING_TIMEOUT_MS: 30000
  RAG_EMBEDDING_MAX_ATTEMPTS: 4
  RAG_EMBEDDING_RETRY_BACKOFF_MS: 100
  RAG_ES_ENABLED: "true"
  RAG_ES_ENDPOINT: http://elasticsearch:9200
  RAG_ES_INDEX_NAME: rag_chunks_acceptance
  RAG_ES_VECTOR_DIMENSIONS: 8

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragkb
      POSTGRES_USER: ragkb
      POSTGRES_PASSWORD: ragkb-acceptance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragkb -d ragkb"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    user: "999:999"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /data:size=300m,mode=1777,uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ragacceptance
      MINIO_ROOT_PASSWORD: ragacceptance-secret
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    command:
      - >-
        mc alias set acceptance http://minio:9000 ragacceptance ragacceptance-secret
        && mc mb --ignore-existing acceptance/rag-kb
        && mc anonymous set none acceptance/rag-kb
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  # backend-py 目前没有自己的 DB 迁移工具(Java 版靠 Flyway 在应用启动时自动建表,
  # Python 版 `app/core/db.py` 明确说明"DDL 权威来源不变",一直借用 Java 那份 Flyway
  # 脚本,只是从未把建表这一步独立出来)。Java 退役时 `db/migration/` 整个目录跟着
  # backend/ 一起被删除,backend-py 完全没有替代的建表机制——这是本次改造过程中
  # 发现的、任务描述之外的额外缺口。这里用官方 Flyway CLI 镜像做一次性迁移
  # 容器,复用从 Java 版恢复到 `backend-py/db/migration/` 的原始 V001-V015 DDL
  # (纯 SQL,表名已与 backend-py 的 SQLAlchemy 模型逐一核对一致),迁移完成后
  # `flyway_schema_history` 表存在,api/worker 依赖它 completed_successfully 才启动。
  migrate:
    image: flyway/flyway:10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend-py/db/migration:/flyway/sql:ro
    command:
      - -url=jdbc:postgresql://postgres:5432/ragkb
      - -user=ragkb
      - -password=ragkb-acceptance
      - -connectRetries=20
      - migrate
    security_opt:
      - no-new-privileges:true

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    mem_limit: 1536m

  # Milvus 验收依赖使用独立 etcd 与对象存储，避免与业务原文件 bucket 共享根空间。
  milvus-etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.18
    command: ["etcd", "--advertise-client-urls=http://127.0.0.1:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  milvus-object-storage:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["minio", "server", "/minio_data"]
    environment:
      MINIO_ROOT_USER: ${RAG_MILVUS_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${RAG_MILVUS_MINIO_SECRET_KEY}
    volumes:
      - milvus_object_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.6.19
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-object-storage:9000
      MINIO_ACCESS_KEY_ID: ${RAG_MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${RAG_MILVUS_MINIO_SECRET_KEY}
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    mem_limit: 4g

  model-stub:
    build:
      context: ./model-stub
    image: rag-acceptance-model:1.0.0
    restart: unless-stopped
    init: true
    environment:
      # 验收客户端必须在这两个 503 后自动恢复，证明有界瞬时错误重试生效。
      MODEL_STUB_FAIL_FIRST_N: 2
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend-common
    environment:
      <<: *backend-environment
      RAG_INGESTION_WORKER_ENABLED: "false"
      RAG_EMBEDDING_ENABLED: "false"
      RAG_ES_ENABLED: "false"
    ports:
      - "127.0.0.1:${ACCEPTANCE_API_PORT:-18090}:8090"
    healthcheck:
      # Java 是 Spring Boot Actuator 的 /actuator/health;Python 版 app/main.py 手写的
      # 是 /health(返回 {"status": "UP"})。
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker-a:
    <<: *backend-common
    environment:
      <<: *worker-environment
      RAG_INGESTION_WORKER_ID: acceptance-worker-a
    depends_on:
      api:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      model-stub:
        condition: service_healthy

  worker-b:
    <<: *backend-common
    environment:
      <<: *worker-environment
      RAG_INGESTION_WORKER_ID: acceptance-worker-b
    depends_on:
      api:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      model-stub:
        condition: service_healthy

  fixture-generator:
    build:
      context: ./fixtures
    image: rag-acceptance-fixtures:1.0.0
    volumes:
      - acceptance_fixtures:/fixtures

  runner:
    build:
      context: ./runner
    image: rag-acceptance-runner:1.0.0
    profiles: ["acceptance"]
    environment:
      ACCEPTANCE_MODE: ${ACCEPTANCE_MODE:-full}
      ACCEPTANCE_DOCUMENT_COUNT: ${ACCEPTANCE_DOCUMENT_COUNT:-5000}
      ACCEPTANCE_UPLOAD_CONCURRENCY: ${ACCEPTANCE_UPLOAD_CONCURRENCY:-24}
      ACCEPTANCE_TIMEOUT_SECONDS: ${ACCEPTANCE_TIMEOUT_SECONDS:-7200}
    volumes:
      - acceptance_fixtures:/fixtures:ro
      - acceptance_reports:/reports
    depends_on:
      fixture-generator:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker-a:
        condition: service_started
      worker-b:
        condition: service_started
      elasticsearch:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
  milvus_etcd_data:
  milvus_object_data:
  milvus_data:
  acceptance_fixtures:
  acceptance_reports:
