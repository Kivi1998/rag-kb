# 测试配置 — 使用 H2 内存库,不依赖外部服务
# 注意：这里的 exclude 会整体覆盖(而非合并)主 application.yml 的同名配置，
# 必须和主配置保持同一份列表，否则被排除的自动装配会在测试时意外重新生效
# （2026-07-15 真实踩过：加了 MongoDB 依赖后，测试期间意外尝试连接默认的
# localhost:27017，因为这里当时只排除了 Elasticsearch）。
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    jwt:
      secret: test-secret-key-at-least-32-bytes-long-for-hs256
      expiration-seconds: 86400
  data:
    redis:
      host: localhost
      port: 6379

management:
  health:
    elasticsearch:
      enabled: false
