# rag-kb 编排后端配置
# 密钥/凭证放 application-secret.yml(不进 git),通过 spring.profiles.include 或 .env 加载

server:
  port: 8090

spring:
  application:
    name: rag-kb
  autoconfigure:
    # 本项目只使用 rag.elasticsearch.* 自研连接；禁止 Boot 按 localhost:9200 偷建第二个客户端。
    exclude: org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

  # 数据库 — 从 application-secret.yml 或环境变量覆盖
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${DB_USERNAME:ragkb}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway 管理 DDL,这里只校验
    properties:
      hibernate:
        format_sql: true

  # 文件上传
  servlet:
    multipart:
      # API 直传的安全上限。大于此值的源视频/超大附件应使用 MinIO 分片直传并走完成回调。
      max-file-size: ${RAG_UPLOAD_MAX_FILE_SIZE:512MB}
      max-request-size: ${RAG_UPLOAD_MAX_REQUEST_SIZE:520MB}

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 安全 — 详见 SecurityConfig
  security:
    jwt:
      # 从 application-secret.yml 覆盖
      secret: ${JWT_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}  # 默认 24 小时

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

rag:
  upload:
    max-size-bytes: ${RAG_UPLOAD_MAX_SIZE_BYTES:536870912}
    direct:
      ttl-seconds: ${RAG_DIRECT_UPLOAD_TTL_SECONDS:900}
      # complete 使用短事务领取校验 token，对象读取超时后可由其他实例重试。
      verification-timeout-ms: ${RAG_DIRECT_UPLOAD_VERIFICATION_TIMEOUT_MS:900000}
      cleanup-interval-ms: ${RAG_DIRECT_UPLOAD_CLEANUP_INTERVAL_MS:60000}
  observability:
    # Prometheus 使用 X-Metrics-Key 请求头；生产环境必须通过 Secret 注入。
    metrics-token: ${RAG_METRICS_TOKEN:}
  parser:
    multimodal:
      # 独立 OCR/版面/ASR 服务；本地 Parser 遇到扫描 PDF 或图片型 PPTX 时才调用。
      enabled: ${RAG_MULTIMODAL_PARSER_ENABLED:false}
      endpoint: ${RAG_MULTIMODAL_PARSER_ENDPOINT:}
      api-key: ${RAG_MULTIMODAL_PARSER_API_KEY:}
      timeout-ms: ${RAG_MULTIMODAL_PARSER_TIMEOUT_MS:600000}
  storage:
    # local 仅用于本地开发与测试；生产环境设置为 minio 并配置 endpoint / bucket / access-key / secret-key
    type: ${RAG_STORAGE_TYPE:local}
    local-root: ${RAG_LOCAL_STORAGE_ROOT:./data/rag-objects}
    endpoint: ${MINIO_ENDPOINT:}
    bucket: ${MINIO_BUCKET:rag-kb}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  ingestion:
    worker:
      # 生产部署时与 Embedding、ES 一起显式开启；Worker 可横向扩容，单实例并发由配置控制。
      enabled: ${RAG_INGESTION_WORKER_ENABLED:false}
      poll-interval-ms: ${RAG_INGESTION_POLL_INTERVAL_MS:1000}
      # 5000+ 文档场景可按解析耗时与 CPU 配额横向扩容；每个实例的内存中任务数不超过 concurrency。
      id: ${RAG_INGESTION_WORKER_ID:${HOSTNAME:rag-ingestion-local}}
      concurrency: ${RAG_INGESTION_WORKER_CONCURRENCY:4}
      batch-size: ${RAG_INGESTION_WORKER_BATCH_SIZE:16}
      lease-duration-ms: ${RAG_INGESTION_WORKER_LEASE_DURATION_MS:1800000}
    cleanup:
      enabled: ${RAG_INGESTION_CLEANUP_ENABLED:true}
      poll-interval-ms: ${RAG_INGESTION_CLEANUP_POLL_INTERVAL_MS:30000}
  model:
    embedding:
      enabled: ${RAG_EMBEDDING_ENABLED:false}
      endpoint: ${RAG_EMBEDDING_ENDPOINT:}
      api-key: ${RAG_EMBEDDING_API_KEY:}
      model: ${RAG_EMBEDDING_MODEL:}
      batch-size: ${RAG_EMBEDDING_BATCH_SIZE:32}
      timeout-ms: ${RAG_EMBEDDING_TIMEOUT_MS:15000}
      # 仅重试连接异常、429 和 5xx；参数错误等 4xx 不重试。
      max-attempts: ${RAG_EMBEDDING_MAX_ATTEMPTS:3}
      retry-backoff-ms: ${RAG_EMBEDDING_RETRY_BACKOFF_MS:200}
    rerank:
      enabled: ${RAG_RERANK_ENABLED:false}
      endpoint: ${RAG_RERANK_ENDPOINT:}
      api-key: ${RAG_RERANK_API_KEY:}
      model: ${RAG_RERANK_MODEL:}
      timeout-ms: ${RAG_RERANK_TIMEOUT_MS:15000}
    generation:
      enabled: ${RAG_GENERATION_ENABLED:false}
      endpoint: ${RAG_GENERATION_ENDPOINT:}
      api-key: ${RAG_GENERATION_API_KEY:}
      model: ${RAG_GENERATION_MODEL:}
      timeout-ms: ${RAG_GENERATION_TIMEOUT_MS:60000}
      # OpenAI 标准流会在最后一个 data 块给出 usage；不兼容的网关可显式关闭。
      include-usage: ${RAG_GENERATION_INCLUDE_USAGE:true}
  elasticsearch:
    # 只有 T107 管道与 ES 均完成部署后开启；向量维度必须与 Embedding 模型完全一致。
    enabled: ${RAG_ES_ENABLED:false}
    endpoint: ${RAG_ES_ENDPOINT:}
    api-key: ${RAG_ES_API_KEY:}
    index-name: ${RAG_ES_INDEX_NAME:rag_chunks_v1}
    vector-dimensions: ${RAG_ES_VECTOR_DIMENSIONS:0}
    connect-timeout-ms: ${RAG_ES_CONNECT_TIMEOUT_MS:3000}
    socket-timeout-ms: ${RAG_ES_SOCKET_TIMEOUT_MS:30000}
  retrieval:
    # T201/T202 完成后显式开启；缺少 Embedding 或 ES Bean 时启动应失败而非走未过滤检索。
    enabled: ${RAG_RETRIEVAL_ENABLED:false}
  query:
    # 开启后必须同时配置 retrieval、embedding、ES 与 generation；缺少 Bean 会 fail-fast。
    enabled: ${RAG_QUERY_ENABLED:false}
    stream-timeout-ms: ${RAG_QUERY_STREAM_TIMEOUT_MS:120000}
    worker-threads: ${RAG_QUERY_WORKER_THREADS:8}

# Actuator
management:
  health:
    elasticsearch:
      enabled: ${RAG_ES_HEALTH_ENABLED:${RAG_ES_ENABLED:false}}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
