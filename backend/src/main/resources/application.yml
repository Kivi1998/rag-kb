# rag-kb 编排后端配置
# 密钥/凭证放 application-secret.yml(不进 git),通过 spring.profiles.include 或 .env 加载

server:
  port: 8090

spring:
  application:
    name: rag-kb

  # 数据库 — 从 application-secret.yml 或环境变量覆盖
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${DB_USERNAME:ragkb}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway 管理 DDL,这里只校验
    properties:
      hibernate:
        format_sql: true

  # 文件上传
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 安全 — 详见 SecurityConfig
  security:
    jwt:
      # 从 application-secret.yml 覆盖
      secret: ${JWT_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}  # 默认 24 小时

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

rag:
  storage:
    # local 仅用于本地开发与测试；生产环境设置为 minio 并配置 endpoint / bucket / access-key / secret-key
    type: ${RAG_STORAGE_TYPE:local}
    local-root: ${RAG_LOCAL_STORAGE_ROOT:./data/rag-objects}
    endpoint: ${MINIO_ENDPOINT:}
    bucket: ${MINIO_BUCKET:rag-kb}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
