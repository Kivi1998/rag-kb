# rag-kb 编排后端配置
# 密钥/凭证放 application-secret.yml(不进 git),通过 spring.profiles.include 或 .env 加载

server:
  port: 8090

spring:
  application:
    name: rag-kb

  # 数据库 — 从 application-secret.yml 或环境变量覆盖
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragkb}
    username: ${DB_USERNAME:ragkb}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway 管理 DDL,这里只校验
    properties:
      hibernate:
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 安全 — 详见 SecurityConfig
  security:
    jwt:
      # 从 application-secret.yml 覆盖
      secret: ${JWT_SECRET:}

# RAGFlow 连接 — 从 application-secret.yml 覆盖
ragflow:
  base-url: ${RAGFLOW_BASE_URL:http://localhost:9380}
  api-key: ${RAGFLOW_API_KEY:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
